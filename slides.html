29 สิงหาคม 2569 · เวลา 08:30–16:00 น.</p>

<h1 id="%E0%B9%80%E0%B8%9B%E0%B9%89%E0%B8%B2%E0%B8%AB%E0%B8%A1%E0%B8%B2%E0%B8%A2%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B8%AD%E0%B8%9A%E0%B8%A3%E0%B8%A1%E0%B8%A7%E0%B8%B1%E0%B8%99%E0%B8%99%E0%B8%B5%E0%B9%89">เป้าหมายของการอบรมวันนี้</h1>
<ul>
<li>วันนี้เรา <strong>ไม่ได้มานั่งดู AI โชว์</strong> แต่มาทำงานของครูให้เสร็จจริง</li>
<li>ครูทุกคนจะออกจากห้องพร้อม <strong>สื่อการสอนพร้อมใช้ 1 ชิ้น</strong></li>
<li>บูรณาการ 3 เครื่องมือฟรี: <strong>Gemini + Canva + NotebookLM</strong></li>
<li>ปลูกฝังทักษะสำคัญที่สุด: <strong>การตรวจทานก่อนนำไปใช้ (Verification First)</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" lang="en-US" data-marpit-pagination="3" style="--paginate:true;" data-marpit-pagination-total="34" data-size="16:9">
<h1 id="%E0%B8%81%E0%B8%B3%E0%B8%AB%E0%B8%99%E0%B8%94%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B8%A7%E0%B8%B1%E0%B8%99%E0%B8%99%E0%B8%B5%E0%B9%89-0830-%E2%80%93-1600-%E0%B8%99">กำหนดการวันนี้ (08:30 – 16:00 น.)</h1>
<ul>
<li><strong>08:30–09:00</strong> Golden Opening: Reset Mindset + Live Wow Demo + Day Roadmap</li>
<li><strong>09:00–10:15</strong> <strong>Gemini</strong>: Prompt ภาษาไทย + [Mini-Workshop 1: แผน/ข้อสอบ] (50 น.)</li>
<li><em>10:15–10:30 พักรับประทานอาหารว่างเช้า</em></li>
<li><strong>10:30–12:00</strong> <strong>Canva</strong>: ออกแบบสื่อ/ภาพ + [Mini-Workshop 2: โปสเตอร์/ใบงาน] (65 น.)</li>
<li><em>12:00–13:00 พักรับประทานอาหารกลางวัน</em></li>
<li><strong>13:00–14:15</strong> <strong>NotebookLM</strong>: สรุปเอกสาร + [Mini-Workshop 3: เสียง Audio Overview] (50 น.)</li>
<li><em>14:15–14:30 พักรับประทานอาหารว่างบ่าย</em></li>
<li><strong>14:30–15:50</strong> <strong>Capstone Workshop</strong>: [AI Speedrun 80 นาที] สื่อครบวงจร 1 ชิ้น + โชว์ผลงาน</li>
<li><strong>15:50–16:00</strong> สรุปจริยธรรม, แนวคิดนวัตกรรม ว.PA (Take-Home W4) &amp; ปิดงาน</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-class="lead" lang="en-US" class="lead" data-marpit-pagination="4" style="--paginate:true;--class:lead;" data-marpit-pagination-total="34" data-size="16:9">
<h1 id="0830-%E2%80%93-0900">08:30 – 09:00</h1>
<h1 id="golden-opening--mindset-reset">Golden Opening &amp; Mindset Reset</h1>
<p><em>ปรับมุมมอง สร้างความเข้าใจ และฉายภาพการทำงานทั้งวัน</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" lang="en-US" data-marpit-pagination="5" style="--paginate:true;" data-marpit-pagination-total="34" data-size="16:9">
<h1 id="reset-mindset-ai-%E0%B8%84%E0%B8%B7%E0%B8%AD%E0%B8%AD%E0%B8%B0%E0%B9%84%E0%B8%A3%E0%B9%83%E0%B8%99%E0%B8%A1%E0%B8%B8%E0%B8%A1%E0%B8%A1%E0%B8%AD%E0%B8%87%E0%B8%84%E0%B8%A3%E0%B8%B9">Reset Mindset: AI คืออะไรในมุมมองครู?</h1>
<ul>
<li><strong>AI ไม่ใช่ Answer Machine (เครื่องตอบคำถามสำเร็จรูป)</strong></li>
<li>แต่ AI คือ <strong>Co-thinker (คู่คิด / ผู้ช่วยวิจัยที่เก่งภาษามาก)</strong></li>
<li><strong>Fluency <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.486ex;" xmlns="http://www.w3.org/2000/svg" width="1.76ex" height="2.106ex" role="img" focusable="false" viewBox="0 -716 778 931"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2260" d="M166 -215T159 -215T147 -212T141 -204T139 -197Q139 -190 144 -183L306 133H70Q56 140 56 153Q56 168 72 173H327L406 327H72Q56 332 56 347Q56 360 70 367H426Q597 702 602 707Q605 716 618 716Q625 716 630 712T636 703T638 696Q638 692 471 367H707Q722 359 722 347Q722 336 708 328L451 327L371 173H708Q722 163 722 153Q722 140 707 133H351Q175 -210 170 -212Q166 -215 159 -215Z"></path></g></g></g></svg></mjx-container> Accuracy</strong>: คำตอบที่เขียนดูมั่นใจ สละสลวย อาจแฝงข้อมูลผิดพลาดได้</li>
<li><strong>Human Accountability</strong>: AI ช่วยคิดและร่างได้ แต่ <strong>ครูคือผู้ตรวจสอบและลงนามรับผิดชอบ</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" lang="en-US" data-marpit-pagination="6" style="--paginate:true;" data-marpit-pagination-total="34" data-size="16:9">
<h1 id="teacher-ai-capability-map-6-%E0%B8%94%E0%B9%89%E0%B8%B2%E0%B8%99%E0%B8%87%E0%B8%B2%E0%B8%99%E0%B8%84%E0%B8%A3%E0%B8%B9">Teacher AI Capability Map (6 ด้านงานครู)</h1>
<ol>
<li><strong>ออกแบบการสอน</strong>: แผน Active Learning, กิจกรรมสืบเสาะ, ใบงาน</li>
<li><strong>การวัดและประเมินผล</strong>: ข้อสอบ, เกณฑ์รูบริก (Rubric), แบบประเมิน</li>
<li><strong>สื่อและภาพประกอบ</strong>: ภาพการ์ตูน, แผนผัง, สไลด์นำเสนอ</li>
<li><strong>เอกสารและธุรการ</strong>: รายงานโครงการ, สรุป SAR, บันทึก PLC, ว.PA</li>
<li><strong>นวัตกรรมการสอน</strong>: บอร์ดเกม, กรณีศึกษา, กิจกรรมจำลอง</li>
<li><strong>ความปลอดภัยและจริยธรรม</strong>: การคุ้มครองข้อมูลนักเรียน (PDPA)</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" lang="en-US" data-marpit-pagination="7" style="--paginate:true;" data-marpit-pagination-total="34" data-size="16:9">
<h1 id="traffic-light-risk-map-%E0%B8%87%E0%B8%B2%E0%B8%99%E0%B9%84%E0%B8%AB%E0%B8%99%E0%B9%83%E0%B8%AB%E0%B9%89-ai-%E0%B8%8A%E0%B9%88%E0%B8%A7%E0%B8%A2%E0%B9%84%E0%B8%94%E0%B9%89%E0%B9%81%E0%B8%84%E0%B9%88%E0%B9%84%E0%B8%AB%E0%B8%99">Traffic Light Risk Map: งานไหนให้ AI ช่วยได้แค่ไหน?</h1>
<ul>
<li><img class="emoji" draggable="false" alt="🟢" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e2.svg" data-marp-twemoji=""/> <strong>โซนเขียว (ให้ช่วยเต็มที่)</strong>: ไอเดียกิจกรรม, ภาพประกอบ, ร่างใบงาน, สรุปเนื้อหาเบื้องต้น</li>
<li><img class="emoji" draggable="false" alt="🟡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e1.svg" data-marp-twemoji=""/> <strong>โซนเหลือง (ช่วยได้แต่ต้องตรวจเข้ม)</strong>: ข้อสอบ, แผนการสอน, เอกสารราชการ, การแปลภาษา</li>
<li><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>โซนแดง (ห้ามปล่อย AI ทำเด็ดขาด)</strong>: การตัดสินผลการเรียน, ข้อมูลลับ/ประวัตินักเรียน (PDPA)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" lang="en-US" data-marpit-pagination="8" style="--paginate:true;" data-marpit-pagination-total="34" data-size="16:9">
<h1 id="7-%E0%B8%82%E0%B9%89%E0%B8%AD%E0%B9%81%E0%B8%81%E0%B8%99%E0%B8%81%E0%B8%A5%E0%B8%B2%E0%B8%87%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B8%84%E0%B8%A3%E0%B8%B9%E0%B8%95%E0%B9%89%E0%B8%AD%E0%B8%87%E0%B8%A3%E0%B8%B9%E0%B9%89">7 ข้อแกนกลางที่ครูต้องรู้</h1>
<ol>
<li><strong>Text vs Scan</strong>: AI อ่านไฟล์ข้อความได้แม่นยำกว่าภาพสแกน</li>
<li><strong>1 Task = 1 Chat</strong>: เมื่องานเปลี่ยนเรื่อง ให้เปิดแชทใหม่เสมอ</li>
<li><strong>Context &gt; Prompt</strong>: ยิ่งให้บริบทชัดเจน งานยิ่งตรงใจ</li>
<li><strong>ความจริงเรื่องภาพ AI</strong>: AI วาดตัวหนังสือไทยไม่ได้ <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> วาดภาพด้วย AI แล้วใส่ตัวหนังสือใน Canva</li>
<li><strong>Zero Hallucination ด้วย NotebookLM</strong>: บังคับให้ตอบจากเอกสารต้นฉบับเท่านั้น</li>
<li><strong>Verification Ladder</strong>: ตรวจตาเปล่า <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> เช็คอ้างอิง <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> ครูตรวจความถูกต้อง</li>
<li><strong>Privacy by Default</strong>: ลบชื่อ-เลขประจำตัวเด็กก่อนนำข้อมูลเข้า AI ฟรีเสมอ</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" lang="en-US" data-marpit-pagination="9" style="--paginate:true;" data-marpit-pagination-total="34" data-size="16:9">
<h1 id="live-wow-demonstration-3-%E0%B8%99%E0%B8%B2%E0%B8%97%E0%B8%B5">Live Wow Demonstration (3 นาที)</h1>
<blockquote>
<p><strong>&quot;จากกระดาษเก่า 1 แผ่น <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> สู่โจทย์ Active Learning 5 ข้อใน 30 วินาที&quot;</strong></p>
</blockquote>
<ol>
<li>สแกนข้อสอบ/ใบงานเก่าด้วยสมาร์ทโฟน</li>
<li>อัปโหลดเข้า Gemini พร้อมสั่งแปลงเป็นโจทย์ประยุกต์ใหม่</li>
<li>โหลดไฟล์เกณฑ์เข้า NotebookLM <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> สรุปประเด็นเป็น Audio Overview ทันที</li>
</ol>
<p><em>เห็นพลังของ AI แล้วใช่ไหมครับ? แต่ทักษะที่สำคัญกว่าคือ <strong>การตรวจก่อนนำไปใช้</strong>!</em></p>
</section>

<h1 id="%E0%B8%9B%E0%B8%A5%E0%B8%94%E0%B8%A5%E0%B9%87%E0%B8%AD%E0%B8%81%E0%B8%84%E0%B8%A7%E0%B8%B2%E0%B8%A1%E0%B8%81%E0%B8%B1%E0%B8%87%E0%B8%A7%E0%B8%A5-3-%E0%B8%97%E0%B8%B2%E0%B8%87%E0%B9%80%E0%B8%A5%E0%B8%B7%E0%B8%AD%E0%B8%81-entry-paths">ปลดล็อกความกังวล: 3 ทางเลือก (Entry Paths)</h1>
<ul>
<li><img class="emoji" draggable="false" alt="📂" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4c2.svg" data-marp-twemoji=""/> <strong>Path A (มีไฟล์งานจริงมา)</strong>: นำแผน/ข้อสอบ/เอกสารเก่าของตนเองมาปรับปรุง</li>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <strong>Path B (มีแค่หัวข้อในใจ)</strong>: นำเรื่องที่จะสอนสัปดาห์หน้ามาใช้สูตรคำสั่งสร้างใหม่</li>
<li><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>Path C (ไม่มีไฟล์/คิดไม่ออก)</strong>: สแกน QR Code เข้าเว็บ <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> เลือก <strong>Zero-Prep Starter Kits</strong> (มีโจทย์พร้อม Prompt จำลองครบ 8 กลุ่มสาระ กดคัดลอกใน 1 คลิก!)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-class="lead" lang="en-US" class="lead" data-marpit-pagination="11" style="--paginate:true;--class:lead;" data-marpit-pagination-total="34" data-size="16:9">
<h1 id="0900-%E2%80%93-1015">09:00 – 10:15</h1>
<h1 id="session-1-gemini--%E0%B8%9E%E0%B8%A5%E0%B8%B1%E0%B8%87%E0%B8%81%E0%B8%B2%E0%B8%A3-prompt-%E0%B8%A0%E0%B8%B2%E0%B8%A9%E0%B8%B2%E0%B9%84%E0%B8%97%E0%B8%A2">Session 1: Gemini &amp; พลังการ Prompt ภาษาไทย</h1>
<p><em>เทคนิคสั่งงาน AI ให้ได้ผลลัพธ์คมชัด ตรงเป้าหมายการสอน</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" lang="en-US" data-marpit-pagination="12" style="--paginate:true;" data-marpit-pagination-total="34" data-size="16:9">
<h1 id="%E0%B9%81%E0%B8%9C%E0%B8%99%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B8%AA%E0%B8%AD%E0%B8%99%E0%B9%81%E0%B8%A5%E0%B8%B0%E0%B9%82%E0%B8%84%E0%B8%A3%E0%B8%87%E0%B8%AA%E0%B8%A3%E0%B9%89%E0%B8%B2%E0%B8%87%E0%B8%84%E0%B8%B3%E0%B8%AA%E0%B8%B1%E0%B9%88%E0%B8%87%E0%B8%A1%E0%B8%B2%E0%B8%95%E0%B8%A3%E0%B8%90%E0%B8%B2%E0%B8%99-c-g-i-c-o-v-framework">แผนการสอนและโครงสร้างคำสั่งมาตรฐาน: C-G-I-C-O-V Framework</h1>
<ul>
<li><strong>1. Context (บริบทผู้เรียน)</strong>: คุณเป็นครูคณิตศาสตร์ ม.2 ชั้นเรียน 35 คน มีพื้นฐานปานกลาง</li>
<li><strong>2. Goal (เป้าหมายการเรียนรู้)</strong>: ออกแบบแผน Active Learning 1 คาบ (50 นาที) เรื่อง ทฤษฎีบทพีทาโกรัส</li>
<li><strong>3. Input (ข้อมูลตั้งต้น/Misconception)</strong>: นักเรียนมักเข้าใจผิดคิดว่าด้าน c ต้องเป็นเส้นเอียงเสมอ</li>
<li><strong>4. Criteria (เกณฑ์คุณภาพ)</strong>: มีคำถามนำแบบ Socratic 3 ข้อ, ชุดโจทย์ 3 ระดับ พร้อมเฉลยวิธีคิด</li>
<li><strong>5. Output &amp; Verification (รูปแบบ &amp; ตรวจทาน)</strong>: ขอรูปแบบตาราง 5 ขั้นตอน ภาษาไทยกระชับ และตรวจทานเฉลยตัวเลขทุกข้อ</li>
<li><strong>Goal / Task (ภารกิจ / ภ)</strong>: ออกแบบแผน Active Learning 1 คาบ เรื่อง ทฤษฎีบทพีทาโกรัส</li>
<li><strong>Input (ข้อมูลตั้งต้น)</strong>: เนื้อหาเดิมจากหลักสูตร หรือปัญหาที่เด็กมักสับสนเรื่องด้าน <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="0.98ex" height="1.025ex" role="img" focusable="false" viewBox="0 -442 433 453"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D450" d="M34 159Q34 268 120 355T306 442Q362 442 394 418T427 355Q427 326 408 306T360 285Q341 285 330 295T319 325T330 359T352 380T366 386H367Q367 388 361 392T340 400T306 404Q276 404 249 390Q228 381 206 359Q162 315 142 235T121 119Q121 73 147 50Q169 26 205 26H209Q321 26 394 111Q403 121 406 121Q410 121 419 112T429 98T420 83T391 55T346 25T282 0T202 -11Q127 -11 81 37T34 159Z"></path></g></g></g></svg></mjx-container></li>
<li><strong>Criteria (เกณฑ์)</strong>: ใช้กิจกรรมแก้โจทย์บันไดพาดกำแพง, มีคำถาม Socratic 3 ข้อ</li>
<li><strong>Output &amp; Format (ผลลัพธ์ / ผ)</strong>: ตาราง 5 ขั้นตอน ภาษาไทย กระชับ พร้อมนำไปสอน</li>
<li><strong>Verification (การตรวจทาน)</strong>: ตรวจสอบเฉลยตัวเลขทุกข้อให้ถูกต้อง <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.127ex;" xmlns="http://www.w3.org/2000/svg" width="5.278ex" height="1.824ex" role="img" focusable="false" viewBox="0 -750 2333 806"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mn"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z"></path><path data-c="30" d="M96 585Q152 666 249 666Q297 666 345 640T423 548Q460 465 460 320Q460 165 417 83Q397 41 362 16T301 -15T250 -22Q224 -22 198 -16T137 16T82 83Q39 165 39 320Q39 494 96 585ZM321 597Q291 629 250 629Q208 629 178 597Q153 571 145 525T137 333Q137 175 145 125T181 46Q209 16 250 16Q290 16 318 46Q347 76 354 130T362 333Q362 478 354 524T321 597Z" transform="translate(500,0)"></path><path data-c="30" d="M96 585Q152 666 249 666Q297 666 345 640T423 548Q460 465 460 320Q460 165 417 83Q397 41 362 16T301 -15T250 -22Q224 -22 198 -16T137 16T82 83Q39 165 39 320Q39 494 96 585ZM321 597Q291 629 250 629Q208 629 178 597Q153 571 145 525T137 333Q137 175 145 125T181 46Q209 16 250 16Q290 16 318 46Q347 76 354 130T362 333Q362 478 354 524T321 597Z" transform="translate(1000,0)"></path></g><g data-mml-node="mi" transform="translate(1500,0)"><path data-c="25" d="M465 605Q428 605 394 614T340 632T319 641Q332 608 332 548Q332 458 293 403T202 347Q145 347 101 402T56 548Q56 637 101 693T202 750Q241 750 272 719Q359 642 464 642Q580 642 650 732Q662 748 668 749Q670 750 673 750Q682 750 688 743T693 726Q178 -47 170 -52Q166 -56 160 -56Q147 -56 142 -45Q137 -36 142 -27Q143 -24 363 304Q469 462 525 546T581 630Q528 605 465 605ZM207 385Q235 385 263 427T292 548Q292 617 267 664T200 712Q193 712 186 709T167 698T147 668T134 615 </ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" lang="en-US" data-marpit-pagination="13" style="--paginate:true;" data-marpit-pagination-total="34" data-size="16:9">
<h1 id="%E0%B9%80%E0%B8%9B%E0%B8%A3%E0%B8%B5%E0%B8%A2%E0%B8%9A%E0%B9%80%E0%B8%97%E0%B8%B5%E0%B8%A2%E0%B8%9A%E0%B8%9C%E0%B8%A5%E0%B8%A5%E0%B8%B1%E0%B8%9E%E0%B8%98%E0%B9%8C-%E0%B8%81%E0%B9%88%E0%B8%AD%E0%B8%99--%E0%B8%AB%E0%B8%A5%E0%B8%B1%E0%B8%87">เปรียบเทียบผลลัพธ์ ก่อน / หลัง</h1>
<p><strong><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> ก่อน (Prompt สั้น ลอยๆ):</strong></p>
<blockquote>
<p>&quot;ช่วยทำแผนการสอนเรื่องแรง ม.2 ให้หน่อย&quot;<br />
<em>(ผลลัพธ์: ได้เนื้อหากว้างๆ ทั่วไป ไม่ตรงกับสภาพห้องเรียนจริง)</em></p>
</blockquote>
<p><strong><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> หลัง (Context-Rich Prompt):</strong></p>
<blockquote>
<p>&quot;คุณเป็นครูวิทยาศาสตร์ ม.2 ออกแบบแผน Active Learning 1 คาบ 50 นาที เรื่อง แรงและความดัน นักเรียน 40 คน จัดการเรียนรู้แบบกลุ่ม 4 คน ขอคำถามกระตุ้นการคิด 3 ข้อ กิจกรรมการทดลองสืบเสาะ และเกณฑ์วัดผล ภาษาไทยกระชับ&quot;</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" lang="en-US" data-marpit-pagination="14" style="--paginate:true;" data-marpit-pagination-total="34" data-size="16:9">
<h1 id="%E0%B9%80%E0%B8%97%E0%B8%84%E0%B8%99%E0%B8%B4%E0%B8%84-multi-turn-refinement--misconception">เทคนิค Multi-turn Refinement &amp; Misconception</h1>
<ul>
<li><strong>ไม่ต้องเริ่มแชทใหม่เมื่อผลยังไม่เป๊ะ</strong>: ใช้คำสั่งต่อเนื่อง

<h1 id="mini-workshop-1-%E0%B8%87%E0%B8%B2%E0%B8%99%E0%B8%AA%E0%B8%AD%E0%B8%99-50-%E0%B8%99%E0%B8%B2%E0%B8%97%E0%B8%B5">Mini-Workshop 1: งานสอน (50 นาที)</h1>
<p><strong>โจทย์ชิ้นงาน (Deliverable): เลือกทำ 1 ชิ้น</strong></p>
<ol>
<li>แผนการจัดการเรียนรู้ Active Learning 1 คาบ หรือ</li>
<li>ชุดข้อสอบวัดผล 5 ข้อ พร้อมเฉลยละเอียดและเกณฑ์การให้คะแนน หรือ</li>
<li>ใบกิจกรรมการเรียนรู้แบบสืบเสาะ 1 หน้า</li>
</ol>
<p><em>ครูสามารถใช้ไฟล์จริง หรือกดปุ่มคัดลอกจาก <strong>Zero-Prep Starter Kits</strong> บนหน้าเว็บได้ทันที</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" lang="en-US" data-marpit-pagination="17" style="--paginate:true;" data-marpit-pagination-total="34" data-size="16:9">
<h1 id="verification-drill-a-%E0%B8%88%E0%B8%B1%E0%B8%9A%E0%B9%82%E0%B8%9B%E0%B9%8A%E0%B8%B0-citation--%E0%B9%81%E0%B8%AB%E0%B8%A5%E0%B9%88%E0%B8%87%E0%B8%AD%E0%B9%89%E0%B8%B2%E0%B8%87%E0%B8%AD%E0%B8%B4%E0%B8%87%E0%B8%9B%E0%B8%A5%E0%B8%AD%E0%B8%A1">Verification Drill A: จับโป๊ะ Citation / แหล่งอ้างอิงปลอม</h1>
<ul>
<li><strong>ทดลองทำจริง</strong>: ให้พิมพ์สั่ง AI ร่างหนังสือราชการและอ้างอิงระเบียบ สพฐ.</li>
<li><strong>สิ่งที่ต้องระวัง (Hallucination)</strong>:
<ul>
<li>AI อาจแต่งเลขที่หนังสือ เช่น <em>&quot;ศธ 04001/ว 1234&quot;</em> หรือปี พ.ศ. ที่ไม่มีจริง</li>
<li>AI แต่งสถิติ เช่น <em>&quot;นักเรียนไทย 87.3% เข้าใจเรื่องนี้...&quot;</em></li>
</ul>
</li>
<li><strong>กฎเหล็กการตรวจทาน</strong>:
<ul>
<li><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50d.svg" data-marp-twemoji=""/> <strong>ค้นหาในเว็บทางการก่อนเสมอ</strong> ถ้าค้นไม่เจอเลขที่ระเบียบ <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> <strong>ห้ามใช้เด็ดขาด</strong></li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-class="lead" lang="en-US" class="lead" data-marpit-pagination="18" style="--paginate:true;--class:lead;" data-marpit-pagination-total="34" data-size="16:9">
<h1 id="1030-%E2%80%93-1200">10:30 – 12:00</h1>
<h1 id="session-2-canva--%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B8%AA%E0%B8%A3%E0%B9%89%E0%B8%B2%E0%B8%87%E0%B8%AA%E0%B8%B7%E0%B9%88%E0%B8%AD%E0%B8%9B%E0%B8%A3%E0%B8%B0%E0%B8%81%E0%B8%AD%E0%B8%9A%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B8%AA%E0%B8%AD%E0%B8%99">Session 2: Canva &amp; การสร้างสื่อประกอบการสอน</h1>
<p><em>เปลี่ยนข้อความจาก AI ให้กลายเป็นสื่ออินโฟกราฟิกสวยงาม คมชัด</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" lang="en-US" data-marpit-pagination="19" style="--paginate:true;" data-marpit-pagination-total="34" data-size="16:9">
<h1 id="%E0%B8%81%E0%B8%8E%E0%B9%80%E0%B8%AB%E0%B8%A5%E0%B9%87%E0%B8%81-ai-visuals-%E0%B8%84%E0%B8%A7%E0%B8%B2%E0%B8%A1%E0%B8%88%E0%B8%A3%E0%B8%B4%E0%B8%87%E0%B9%80%E0%B8%A3%E0%B8%B7%E0%B9%88%E0%B8%AD%E0%B8%87%E0%B8%A0%E0%B8%B2%E0%B8%A9%E0%B8%B2%E0%B9%84%E0%B8%97%E0%B8%A2%E0%B9%83%E0%B8%99%E0%B8%A0%E0%B8%B2%E0%B8%9E">กฎเหล็ก AI Visuals: ความจริงเรื่องภาษาไทยในภาพ</h1>
<ul>
<li><strong>ทำไม AI วาดตัวหนังสือไทยแล้วเละ/เพี้ยน?</strong>
<ul>
<li>โมเดล AI Gen ภาพถูกเทรนด้วยภาษาอังกฤษเป็นหลัก และมองตัวอักษรเป็น &quot;พิกเซลภาพ&quot; ไม่ใช่ตัวพิมพ์</li>
</ul>
</li>
<li><strong>สูตรแก้ปัญหาที่ถูกต้อง (The 2-Step Pattern)</strong>:
<ol>
<li><strong>Gen ภาพด้วย AI (Gemini / Canva Text-to-Image)</strong>: สั่งภาพไร้ตัวอักษร (<code>no text, no letters</code>)</li>
<li><strong>จัดหน้าใน Canva</strong>: นำภาพมาตัดพื้นหลัง วางลงเทมเพลต แล้วพิมพ์ข้อความภาษาไทยด้วยฟอนต์มาตรฐาน</li>
</ol>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" lang="en-US" data-marpit-pagination="20" style="--paginate:true;" data-marpit-pagination-total="34" data-size="16:9">
<h1 id="%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B9%83%E0%B8%8A%E0%B9%89-magic-studio-%E0%B9%83%E0%B8%99-canva-%E0%B8%AA%E0%B8%B3%E0%B8%AB%E0%B8%A3%E0%B8%B1%E0%B8%9A%E0%B8%84%E0%B8%A3%E0%B8%B9">การใช้ Magic Studio ใน Canva สำหรับครู</h1>
<ul>
<li><strong>AI Text to Image</strong>: เจนภาพประกอบเฉพาะวิชา (เลือกสไตล์ การ์ตูน/เวกเตอร์/สมจริง)</li>
<li><strong>Background Remover (ลบพื้นหลังใน 1 คลิก)</strong>: ตัดภาพวัตถุมาซ้อนในใบงาน</li>
<li><strong>Magic Eraser</strong>: ลบส่วนเกินหรือตัวอักษรขยะออกจากภาพ</li>
<li><strong>Canva Education</strong>: ครูที่มีอีเมลโรงเรียนจะปลดล็อกฟีเจอร์พรีเมียมทั้งหมดฟรี</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" lang="en-US" data-marpit-pagination="21" style="--paginate:true;" data-marpit-pagination-total="34" data-size="16:9">
<h1 id="mini-workshop-2-%E0%B8%AA%E0%B8%B7%E0%B9%88%E0%B8%AD%E0%B9%81%E0%B8%A5%E0%B8%B0%E0%B9%83%E0%B8%9A%E0%B8%87%E0%B8%B2%E0%B8%99%E0%B8%AD%E0%B8%B4%E0%B8%99%E0%B9%82%E0%B8%9F%E0%B8%81%E0%B8%A3%E0%B8%B2%E0%B8%9F%E0%B8%B4%E0%B8%81-65-%E0%B8%99%E0%B8%B2%E0%B8%97%E0%B8%B5">Mini-Workshop 2: สื่อและใบงานอินโฟกราฟิก (65 นาที)</h1>
<p><strong>โจทย์ชิ้นงาน (Deliverable):</strong></p>
<ul>
<li>สร้าง <strong>สื่อการสอน 1 หน้า</strong> (โปสเตอร์ A4 หรือ สไลด์สรุปบทเรียน 16:9)</li>
<li>นำเนื้อหาที่ร่างไว้จาก Session 1 มาจัดวาง</li>
<li>ใช้ภาพ AI ประกอบบทเรียนที่ตัดพื้นหลังอย่างกลมกลืน</li>
<li>Export ผลงานเป็นไฟล์ PNG หรือ PDF คุณภาพสูง</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-class="lead" lang="en-US" class="lead" data-marpit-pagination="22" style="--paginate:true;--class:lead;" data-marpit-pagination-total="34" data-size="16:9">
<h1 id="1300-%E2%80%93-1415">13:00 – 14:15</h1>
<h1 id="session-3-notebooklm-%E0%B8%9C%E0%B8%B9%E0%B9%89%E0%B8%8A%E0%B9%88%E0%B8%A7%E0%B8%A2%E0%B8%AA%E0%B8%A3%E0%B8%B8%E0%B8%9B%E0%B9%80%E0%B8%AD%E0%B8%81%E0%B8%AA%E0%B8%B2%E0%B8%A3--audio">Session 3: NotebookLM ผู้ช่วยสรุปเอกสาร &amp; Audio</h1>
<p><em>ย่อยตำรา หลักสูตร และรายงานด้วย Grounded AI แบบไม่มั่ว 100%</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" lang="en-US" data-marpit-pagination="23" style="--paginate:true;" data-marpit-pagination-total="34" data-size="16:9">
<h1 id="grounded-ai-zero-hallucination-%E0%B8%84%E0%B8%B7%E0%B8%AD%E0%B8%AD%E0%B8%B0%E0%B9%84%E0%B8%A3">Grounded AI (Zero Hallucination) คืออะไร?</h1>
<ul>
<li><strong>Gemini ทั่วไป</strong>: ตอบจากความรู้ทั้งโลก (มีโอกาสแต่งเรื่อง/มั่วได้)</li>
<li><strong>NotebookLM (Grounded AI)</strong>: บังคับให้ AI <strong>อ่านและตอบเฉพาะไฟล์ที่เราอัปโหลดเข้าไปเท่านั้น</strong></li>
<li>ทุกคำตอบจะมี <strong>เลข Citation อ้างอิง</strong> คลิกดูหน้าที่มาใน PDF ได้ทันที</li>
<li>เหมาะมากสำหรับ: คู่มือหลักสูตร, ตำราเรียนหนาๆ, เอกสาร ก.ค.ศ., เกณฑ์ ว.PA, สรุป SAR</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" lang="en-US" data-marpit-pagination="24" style="--paginate:true;" data-marpit-pagination-total="34" data-size="16:9">
<h1 id="%E0%B8%99%E0%B8%A7%E0%B8%B1%E0%B8%95%E0%B8%81%E0%B8%A3%E0%B8%A3%E0%B8%A1%E0%B9%80%E0%B8%AA%E0%B8%B5%E0%B8%A2%E0%B8%87-audio-overview-podcast-2-%E0%B8%9C%E0%B8%B9%E0%B9%89%E0%B8%94%E0%B8%B3%E0%B9%80%E0%B8%99%E0%B8%B4%E0%B8%99%E0%B8%A3%E0%B8%B2%E0%B8%A2%E0%B8%81%E0%B8%B2%E0%B8%A3">นวัตกรรมเสียง: Audio Overview (Podcast 2 ผู้ดำเนินรายการ)</h1>
<ul>
<li>เปลี่ยนเอกสารหลายสิบหน้าให้กลายเป็น <strong>บทสนทนาเสียง (Deep Dive Podcast)</strong></li>
<li>ประโยชน์สำหรับครูและผู้เรียน:
<ul>
<li>ครูฟังสรุปเอกสารราชการ/เกณฑ์ประเมินระหว่างเดินทาง</li>
<li>สร้างเป็นสื่อเสียงสรุปบทเรียนให้นักเรียนฟังทบทวนก่อนสอบ</li>
</ul>
</li>
<li><em>ข้อควรระวัง</em>: เสียงสังเคราะห์อาจมีการสรุปผิดพลาดบางจุด ควรใช้เป็นสื่อเสริมการฟัง</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" lang="en-US" data-marpit-pagination="25" style="--paginate:true;" data-marpit-pagination-total="34" data-size="16:9">
<h1 id="mini-workshop-3-%E0%B8%AA%E0%B8%A3%E0%B8%B8%E0%B8%9B%E0%B9%80%E0%B8%AD%E0%B8%81%E0%B8%AA%E0%B8%B2%E0%B8%A3--%E0%B8%A3%E0%B8%B1%E0%B8%99%E0%B9%80%E0%B8%AA%E0%B8%B5%E0%B8%A2%E0%B8%87-podcast-50-%E0%B8%99%E0%B8%B2%E0%B8%97%E0%B8%B5">Mini-Workshop 3: สรุปเอกสาร &amp; รันเสียง Podcast (50 นาที)</h1>
<p><strong>โจทย์ชิ้นงาน (Deliverable):</strong></p>
<ol>
<li>อัปโหลดไฟล์เนื้อหาบทเรียน หรือไฟล์ PDF เกณฑ์จำลองเข้า NotebookLM</li>
<li>สั่งให้ AI สรุปสาระสำคัญในรูปแบบ <strong>Study Guide</strong> และ <strong>ตารางเปรียบเทียบ</strong></li>
<li>กดปุ่ม <strong>Generate Audio Overview</strong> เพื่อสร้างไฟล์เสียงสรุปบทเรียน</li>
<li>ทดลองตั้งคำถามเจาะลึกจากเนื้อหาในเอกสาร</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" lang="en-US" data-marpit-pagination="26" style="--paginate:true;" data-marpit-pagination-total="34" data-size="16:9">
<h1 id="verification-drill-c-%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B8%84%E0%B8%B1%E0%B8%94%E0%B8%81%E0%B8%A3%E0%B8%AD%E0%B8%87%E0%B8%82%E0%B9%89%E0%B8%AD%E0%B8%A1%E0%B8%B9%E0%B8%A5%E0%B8%AA%E0%B9%88%E0%B8%A7%E0%B8%99%E0%B8%9A%E0%B8%B8%E0%B8%84%E0%B8%84%E0%B8%A5-pdpa">Verification Drill C: การคัดกรองข้อมูลส่วนบุคคล (PDPA)</h1>
<ul>
<li><strong>กฎความปลอดภัยของข้อมูลนักเรียน</strong>:
<ul>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> <strong>ห้ามอัปโหลด</strong>: รายชื่อจริง, เลขประจำตัวประชาชน 13 หลัก, ผลการเรียนรายบุคคล, ภาพใบหน้าเด็ก</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> <strong>การทำ Data Masking</strong>: เปลี่ยนเป็น <em>&quot;นักเรียนคนที่ 1, นักเรียนกลุ่ม A&quot;</em></li>
</ul>
</li>
<li>จำไว้เสมอ: <strong>&quot;AI จำเป็นต้องรู้ชื่อจริงของเด็กคนนี้เพื่อทำงานนี้หรือไม่?&quot;</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-class="lead" lang="en-US" class="lead" data-marpit-pagination="27" style="--paginate:true;--class:lead;" data-marpit-pagination-total="34" data-size="16:9">
<h1 id="1430-%E2%80%93-1550">14:30 – 15:50</h1>
<h1 id="capstone-workshop-ai-speedrun-challenge">Capstone Workshop: AI Speedrun Challenge</h1>
<p><em>จาก 0 สู่สื่อการสอนครบวงจร 1 ชุด ภายใน 80 นาที</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" lang="en-US" data-marpit-pagination="28" style="--paginate:true;" data-marpit-pagination-total="34" data-size="16:9">
<h1 id="%E0%B8%81%E0%B8%95%E0%B8%B4%E0%B8%81%E0%B8%B2-ai-speedrun-%E0%B8%AA%E0%B8%A3%E0%B9%89%E0%B8%B2%E0%B8%87%E0%B8%AA%E0%B8%B7%E0%B9%88%E0%B8%AD%E0%B8%84%E0%B8%A3%E0%B8%9A%E0%B8%A7%E0%B8%87%E0%B8%88%E0%B8%A3-1-%E0%B8%8A%E0%B8%B8%E0%B8%94">กติกา AI Speedrun: สร้างสื่อครบวงจร 1 ชุด</h1>

<h1 id="showcase-gallery--peer-feedback-15-%E0%B8%99%E0%B8%B2%E0%B8%97%E0%B8%B5">Showcase Gallery &amp; Peer Feedback (15 นาที)</h1>
<ul>
<li>สุ่มตัวแทนครู 3-4 ท่าน นำผลงานขึ้นจอใหญ่</li>
<li>ร่วมกันสะท้อนคิด:
<ul>
<li>สื่อชิ้นนี้ช่วยประหยัดเวลาเตรียมสอนได้จริงเท่าใด?</li>
<li>ส่วนไหนที่ AI ช่วยได้ดีที่สุด และส่วนไหนที่ครูต้องออกแรงปรับแก้เองมากที่สุด?</li>
</ul>
</li>
<li>ชื่นชมและมอบของที่ระลึกสำหรับผลงานสร้างสรรค์</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-class="lead" lang="en-US" class="lead" data-marpit-pagination="30" style="--paginate:true;--class:lead;" data-marpit-pagination-total="34" data-size="16:9">
<h1 id="1550-%E2%80%93-1600">15:50 – 16:00</h1>
<h1 id="%E0%B8%88%E0%B8%A3%E0%B8%B4%E0%B8%A2%E0%B8%98%E0%B8%A3%E0%B8%A3%E0%B8%A1-%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B8%95%E0%B9%88%E0%B8%AD%E0%B8%A2%E0%B8%AD%E0%B8%94%E0%B8%99%E0%B8%A7%E0%B8%B1%E0%B8%95%E0%B8%81%E0%B8%A3%E0%B8%A3%E0%B8%A1-%E0%B8%A7pa--%E0%B8%9B%E0%B8%B4%E0%B8%94%E0%B8%87%E0%B8%B2%E0%B8%99">จริยธรรม, การต่อยอดนวัตกรรม ว.PA &amp; ปิดงาน</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" lang="en-US" data-marpit-pagination="31" style="--paginate:true;" data-marpit-pagination-total="34" data-size="16:9">
<h1 id="8-%E0%B8%97%E0%B8%B1%E0%B8%81%E0%B8%A9%E0%B8%B0%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B8%84%E0%B8%87%E0%B8%97%E0%B8%99%E0%B8%81%E0%B8%A7%E0%B9%88%E0%B8%B2-prompt-trick">8 ทักษะที่คงทนกว่า &quot;Prompt Trick&quot;</h1>
<ol>
<li><strong>Problem Framing</strong>: ระบุปัญหาการเรียนรู้ให้ชัดเจน</li>
<li><strong>Context Enrichment</strong>: ให้ข้อมูลบริบทห้องเรียนอย่างรอบด้าน</li>
<li><strong>Critical Evaluation</strong>: ตรวจจับจุดผิดและความสมเหตุสมผล</li>
<li><strong>Pedagogical Alignment</strong>: ตรวจสอบความสอดคล้องกับมาตรฐาน/ตัวชี้วัด</li>
<li><strong>Ethics &amp; Privacy</strong>: ปกป้องข้อมูลส่วนบุคคลของผู้เรียน</li>
<li><strong>Tool Routing</strong>: เลือกใช้เครื่องมือให้ถูกกับประเภทงาน</li>
<li><strong>Iterative Dialoguing</strong>: คุยปรับปรุงผลงานอย่างต่อเนื่อง</li>
<li><strong>Human Empathy</strong>: ใส่หัวใจและความเข้าใจความเป็นมนุษย์ลงในสื่อ</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" lang="en-US" data-marpit-pagination="32" style="--paginate:true;" data-marpit-pagination-total="34" data-size="16:9">
<h1 id="%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B8%95%E0%B9%88%E0%B8%AD%E0%B8%A2%E0%B8%AD%E0%B8%94%E0%B8%AA%E0%B8%B9%E0%B9%88-%E0%B8%99%E0%B8%A7%E0%B8%B1%E0%B8%95%E0%B8%81%E0%B8%A3%E0%B8%A3%E0%B8%A1%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B8%AA%E0%B8%AD%E0%B8%99-%E0%B8%A7pa-take-home-w4">การต่อยอดสู่ &quot;นวัตกรรมการสอน ว.PA&quot; (Take-Home W4)</h1>
<ol>
<li><strong>ระบุปัญหาจริงในห้องเรียน</strong>: เช่น เด็กสับสนเรื่องเศษส่วน / จำคำศัพท์ไม่ได้</li>
<li><strong>ใช้ AI ช่วย Brainstorm</strong>: ขอไอเดียเกม/กิจกรรม/สื่อ 3 รูปแบบ</li>
<li><strong>ออกแบบกลไกนวัตกรรม</strong>: ขยายโครงสร้างและกติกา</li>
<li><strong>สร้างต้นแบบสื่อ</strong>: ใช้ Gemini + Canva + NotebookLM ผลิตสื่อ</li>
<li><strong>เขียนเอกสารสรุปผล ว.PA 1 หน้า</strong>: รายงานผลลัพธ์เชิงปริมาณและคุณภาพ</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" lang="en-US" data-marpit-pagination="33" style="--paginate:true;" data-marpit-pagination-total="34" data-size="16:9">
<h1 id="%E0%B8%AA%E0%B8%A3%E0%B8%B8%E0%B8%9B%E0%B8%9A%E0%B8%97%E0%B9%80%E0%B8%A3%E0%B8%B5%E0%B8%A2%E0%B8%99--%E0%B8%AA%E0%B8%B4%E0%B9%88%E0%B8%87%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B9%84%E0%B8%94%E0%B9%89%E0%B8%A3%E0%B8%B1%E0%B8%9A%E0%B8%81%E0%B8%A5%E0%B8%B1%E0%B8%9A%E0%B8%9A%E0%B9%89%E0%B8%B2%E0%B8%99%E0%B8%A7%E0%B8%B1%E0%B8%99%E0%B8%99%E0%B8%B5%E0%B9%89">สรุปบทเรียน &amp; สิ่งที่ได้รับกลับบ้านวันนี้</h1>
<ul>
<li>[x] <strong>สื่อการสอนพร้อมใช้จริง 1 ชุด</strong> (แผน/ข้อสอบ + โปสเตอร์ Canva + เสียงสรุป)</li>
<li>[x] <strong>แผ่นพับสูตรคำสั่งภาษาไทย (Prompt Cheat-sheet)</strong></li>
<li>[x] <strong>สิทธิ์เข้าถึงคลังคำสั่ง 373 Prompts &amp; Zero-Prep Starter Kits</strong> ตลอดชีพ</li>
<li>[x] <strong>กรอบแนวคิดนวัตกรรมการสอน (W4 Framework)</strong> สำหรับประยุกต์ทำ ว.PA</li>
<li>[x] <strong>Checklist ความปลอดภัยและจริยธรรม AI</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-class="lead" lang="en-US" class="lead" data-marpit-pagination="34" style="--paginate:true;--class:lead;" data-marpit-pagination-total="34" data-size="16:9">
<h1 id="%E0%B8%82%E0%B8%AD%E0%B8%9A%E0%B8%84%E0%B8%B8%E0%B8%93%E0%B8%84%E0%B8%B8%E0%B8%93%E0%B8%84%E0%B8%A3%E0%B8%B9%E0%B8%97%E0%B8%B8%E0%B8%81%E0%B8%97%E0%B9%88%E0%B8%B2%E0%B8%99%E0%B8%84%E0%B8%A3%E0%B8%B1%E0%B8%9A-%F0%9F%99%8F">ขอบคุณคุณครูทุกท่านครับ <img class="emoji" draggable="false" alt="🙏" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f64f.svg" data-marp-twemoji=""/></h1>
